# docker compose — the "I own a VPS" path.
#
#   cd terminal
#   AGENT_LINUX_TOKEN=$(openssl rand -hex 24) docker compose up -d
#
# Pair it with Caddy/Traefik for TLS, or put it behind Cloudflare Tunnel if the
# box has no public IP. A named volume keeps the workspace across `up --build`,
# which is the one thing free PaaS tiers will not give you.
services:
  terminal:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-linux:latest
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      # Required in practice: this container serves root shells.
      AGENT_LINUX_TOKEN: ${AGENT_LINUX_TOKEN:?set AGENT_LINUX_TOKEN first}
      AGENT_LINUX_HOST: 0.0.0.0
      AGENT_LINUX_PORT: "3100"
      AGENT_LINUX_BUILD_ROOT: /data/build
      # Any OpenAI-compatible /v1 endpoint. Unset → Agentbox stays off.
      AGENT_LINUX_AGENTBOX_BASE_URL: ${AGENT_LINUX_AGENTBOX_BASE_URL:-}
      AGENT_LINUX_AGENTBOX_API_KEY: ${AGENT_LINUX_AGENTBOX_API_KEY:-}
      AGENT_LINUX_AGENTBOX_MODEL: ${AGENT_LINUX_AGENTBOX_MODEL:-}
    volumes:
      - nova_build:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3100/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nova_build: